name: Build Demo APK and Keep demo-latest Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Create or update "demo-latest" release
        id: demo_release
        uses: ncipollo/release-action@v1
        with:
          tag: demo-latest
          name: demo-latest
          body: Demo build from ${{ github.sha }}
          draft: false
          prerelease: true
          allow_updates: true
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          artifactContentType: application/vnd.android.package-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
