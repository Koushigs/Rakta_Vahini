name: Deploy docs to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Debug git state
        run: |
          git --version
          echo "=== git status ==="
          git status --porcelain --branch || true
          echo "=== remotes ==="
          git remote -v || true
          echo "=== git config ==="
          git config --list || true

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node (optional for build steps)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Publish `docs/` to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          force_orphan: true

      - name: Ensure Pages settings (optional)
        run: |
          echo "If the site doesn't appear, open Settings → Pages and set Source to 'gh-pages' branch / root.`"
