name: Deploy docs to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (optional for build steps)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Publish `docs/` to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      - name: Ensure Pages settings (optional)
        run: |
          echo "If the site doesn't appear, open Settings → Pages and set Source to 'gh-pages' branch / root.`"
